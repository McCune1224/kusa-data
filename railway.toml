# Railway deployment config (https://railway.com).
#
# Railway auto-detects the Dockerfile, so no build command is required.
# Set the env vars below in the Railway dashboard (Project → Variables):
#
#   ACCESS_TOKEN    — start.gg GraphQL API token (required)
#   SECRET_KEY_BASE — `mix phx.gen.secret` (required; config/runtime.exs raises if missing)
#   PHX_HOST        — your Railway public domain, no scheme, e.g. kusa-data.up.railway.app
#   REDIS_URL       — optional; the app runs uncached without it (e.g. redis://default:pw@host:6379)
#   DATABASE_URL    — optional; enables accounts/bookmarks/leagues/watch state (Postgres plugin)
#
# The runtime stage listens on $PORT (Railway sets it automatically).
# Build the image locally to smoke-test:
#
#   docker build -t kusadata:prod .
#   docker run --rm -p 4000:4000 -e ACCESS_TOKEN -e SECRET_KEY_BASE -e PHX_HOST \
#     -e PORT=4000 -e PHX_SERVER=true kusadata:prod

schema = "railway.json"

# Railway will run the release's own entrypoint; no start command override needed.
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

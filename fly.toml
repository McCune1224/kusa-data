# Fly.io configuration for kusa-data.
# Docs: https://fly.io/docs/reference/configuration/

app = "kusa-data"
primary_region = "iad"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  PHX_HOST = "kusa-data.fly.dev"
  PORT = "4000"
